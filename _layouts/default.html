<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <link rel="shortcut icon" href="{{ "/assets/img/favicon.ico" | relative_url }}" type="image/x-icon">
    {% include mathjax.html %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="wrapper header-inner">
        <a class="site-title" href="{{ "/" | relative_url }}">{{ site.title }}</a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ "/research/" | relative_url }}"{% if page.url contains '/research' %} aria-current="page"{% endif %}>Research</a>
          <a href="{{ "/blog/" | relative_url }}"{% if page.url contains '/blog' or page.layout == 'post' %} aria-current="page"{% endif %}>Blog</a>
          <a href="{{ "/people/" | relative_url }}"{% if page.url contains '/people' %} aria-current="page"{% endif %}>Team</a>
          <a href="https://alignment.dais.princeton.edu/">AIAS</a>
        </nav>
      </div>
    </header>
    <main id="main-content" class="wrapper page-content">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="wrapper">
        <p>Hazan Lab · Princeton University</p>
        <p><a href="https://www.ehazan.com/">Elad Hazan</a> · <a href="https://alignment.dais.princeton.edu/">Princeton AI Alignment and Safety</a></p>
      </div>
    </footer>
  </body>
</html>
